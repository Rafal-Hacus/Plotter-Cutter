# Plotter Cutter: works as is in Portainer (Stacks > Add stack > Web editor), or with: docker compose up -d
# Set the variables below in Portainer's "Environment variables" section (or in a .env file next to this one).
# To build the image from this repository instead of pulling it:
#   docker compose -f docker-compose.yml -f compose.build.yaml up -d --build
services:
  plotter-cutter:
    image: ${IMAGE:-ghcr.io/rafal-hacus/plotter-cutter:latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
      # HTTPS: browsers only let the in-browser AI use the graphics card and all cores on secure pages
      - "${HOST_HTTPS_PORT:-8443}:8443"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      # Optional. Without them the first visit shows a setup page where you create the login, using the
      # setup code from the container log. With them, they win. To keep only a hash, make one in the
      # running container's console with: node server/hash-password.js
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      # "true" when reached over HTTPS through a reverse proxy
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # "true" only behind a reverse proxy that sets X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      # The address(es) you open the app at, e.g. 192.168.1.50 or plotter.local (comma separated), so the
      # self-signed HTTPS certificate matches them. Or your own: TLS_CERT_FILE / TLS_KEY_FILE.
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}
      PUBLIC_HTTPS_PORT: ${HOST_HTTPS_PORT:-8443}
    volumes:
      - plotter-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  plotter-data:
